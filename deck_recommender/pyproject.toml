[project]
name = "deck-recommender"
version = "0.1.0"
description = "使用 Docker 的 pjsk 组卡服务"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.125.0",
    "orjson>=3.11.5",
    "pyyaml>=6.0.3",
    "sekai-deck-recommend-cpp>=0.2.20",
    "setproctitle>=1.3.7",
    "uvicorn>=0.38.0",
    "uvloop>=0.22.1",
    "zstandard>=0.25.0",
]
# 配置镜像源
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true