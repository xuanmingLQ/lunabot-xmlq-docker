[project]
name = "event-tracker"
version = "0.1.0"
description = "lunabot-event-tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "orjson>=3.11.5",
    "pyyaml>=6.0.3",
    "tenacity",
    "setproctitle>=1.3.7",
    "uvloop>=0.22.1",
]

# 配置镜像源
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
